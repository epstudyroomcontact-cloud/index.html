<meta charset="UTF-8">
<!-- Bảo mật (CSP chặt): chỉ chạy mã từ chính web này (overlay.js), không chạy mã viết thẳng trong trang. -->
<meta http-equiv="Content-Security-Policy" content="script-src 'self'; script-src-attr 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; connect-src 'self' https://firestore.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com">

<!-- =========================================================
   BẢNG LỊCH LIVE CHO OBS (Browser Source) — trang riêng, không cần đăng nhập, không có nút bấm.
   Chỉ đọc lịch live CÔNG KHAI (weekly_schedules trong Firestore, giống trang Lịch), tự cập nhật theo giờ thực:
   tô sáng đoạn đang chạy + đếm ngược, làm mờ các đoạn đã qua, tự cuộn để đoạn hiện tại luôn trong khung.
   Lấy lịch lại 3 phút một lần (1 lượt đọc Firebase mỗi lần); lỗi / hết hạn mức thì dùng site-fallback.json.
   Tuỳ chọn trên địa chỉ (ghép bằng & sau dấu ?), ví dụ overlay.html?size=1.3&theme=light&total=0
     size=1.3        cỡ chữ (1 = mặc định, 0.6 – 3)
     (mặc định chữ tự thu nhỏ cho vừa khung OBS để thấy hết lịch; fit=0 để tắt, khi đó danh sách tự cuộn)
     rows=8          chỉ hiện 8 dòng, tự cuộn theo đoạn hiện tại
     theme=dark      dark | light | pink | clear (clear = nền trong suốt, chữ trắng có bóng)
     opacity=0.85    độ đậm của nền thẻ (0 – 1)
     accent=ff3d9a   màu chính (mã màu, không có #)
     total=0 / bar=0 / chip=0 / title=0 / status=0 / now=0   ẩn: tổng phút / thanh màu / dòng tóm tắt / tên buổi / nhãn trạng thái / ô "đang"
     big=0           ẩn khối đếm giờ lớn ở đầu bảng ("FOCUS 3/10" + số đếm ngược to, đọc được trên điện thoại); view=big chỉ hiện khối này
     (mặc định GỌN: khung hẹp ~340px = khối đếm giờ lớn "FOCUS 4/10" + "Progress 3 / 10 done" với thanh 10 ô + "☕ Long break in 2h 38m" + thanh thông báo;
      track=0 ẩn 2 dòng tiến độ / nghỉ dài; rows=2 thêm danh sách 2 đoạn kế tiếp; align=right để dồn sang phải)
     compact=0       bảng cả ngày như bản cũ (tên buổi, tóm tắt, thanh màu, danh sách đầy đủ, tổng phút)
     note=0          ẩn khung thông báo (nhập trong Admin → ô Bắt đầu buổi live → Thông báo trên OBS)
     view=note       chỉ hiện khung thông báo, để đặt riêng một chỗ trên màn hình (không có thông báo thì trống)
     list=0          ẩn danh sách các mốc (chỉ còn phần đầu + ô đang chạy)
     empty=hide      ngày không có live thì ẩn hẳn (mặc định hiện một dòng nhỏ)
     after=60        sau khi buổi kết thúc, còn hiện thêm bao nhiêu phút
     lang=vi         tiếng Việt (mặc định tiếng Anh, cho khán giả YouTube quốc tế)
     tz=Asia/Tokyo   hiện giờ theo múi giờ khác (mặc định giờ Việt Nam)
     view=clock      khối đồng hồ giờ địa phương "12:54:24 · Vietnam · GMT+7 · Fri 23 Oct", dấu hai chấm nhấp nháy.
                     look=pastel (mặc định: thẻ kem viền hồng, icon trăng) | glass (kính tối, số mảnh) | app (cửa sổ 3 chấm màu)
                     | simple (kiểu chữ cũ 2 dòng, theo theme: theme=clear bỏ nền, style=line gộp 1 dòng)
                     (thêm: align=left|center, name=… thêm tên kênh nhỏ,
                      label=… đổi chữ "Vietnam", tz=… múi giờ khác, sec=0 ẩn giây, gmt=0 ẩn GMT+7, date=0 ẩn ngày)
     view=timer      bộ đếm giờ "Session 1/10 · 49:59": bấm Cách để chạy/tạm dừng (Interact trong OBS), → ← đổi hiệp, ↑ ↓ ±1 phút, R làm lại;
                     focus=50&short=10&long=30&rounds=4&every=4&prep=0 tự đặt hiệp (không ghi thì lấy từ lịch Admin hôm nay);
                     mặc định chạy theo lịch Admin + giờ bấm "Bắt đầu" trong Admin, start=manual để tự bấm; scene_focus=…&scene_break=… tự đổi cảnh OBS; next=0; controls=0
     rowcd=0         dòng đang chạy hiện số phút thay vì đếm ngược (mặc định đếm ngược ngay trên dòng đó)
     sound=0         tắt chuông khi sang đoạn (mặc định bật; sound=break chỉ báo khi vào nghỉ; vol=0…100)
     autostart=0     không tự bắt đầu khi bấm Start Streaming trong OBS (mặc định: bấm Start Streaming = buổi live bắt đầu từ lúc đó;
                     cần Properties → Page permissions ≥ "Read access to OBS status information")
     demo=1          xem thử bằng một buổi mẫu đang chạy (để căn chỉnh khi chưa tới giờ live; ago=-10: buổi mẫu bắt đầu sau 10 phút)
   ========================================================= -->
<style>
:root{
  --fs:20px; --accent:#ff3d9a; --short:#2ee6c8; --long:#ffc72c; --prep:#8e9bb0;
  --card:rgba(16,20,32,var(--op,.82)); --ink:#fff; --muted:rgba(255,255,255,.66); --line:rgba(255,255,255,.14); --row-now:rgba(255,255,255,.1);
  --shadow:0 .4rem 1.6rem rgba(0,0,0,.28); --tshadow:none;
}
html[data-theme="light"]{ --card:rgba(255,255,255,var(--op,.92)); --ink:#1d2333; --muted:rgba(29,35,51,.6); --line:rgba(29,35,51,.14); --row-now:rgba(29,35,51,.06); --shadow:0 .3rem 1.2rem rgba(0,0,0,.14); }
html[data-theme="pink"]{ --card:rgba(255,240,247,var(--op,.93)); --ink:#3a1027; --muted:rgba(58,16,39,.6); --line:rgba(58,16,39,.14); --row-now:rgba(255,61,154,.1); --shadow:0 .3rem 1.2rem rgba(120,0,60,.18); }
html[data-theme="clear"]{ --card:transparent; --ink:#fff; --muted:rgba(255,255,255,.82); --line:rgba(255,255,255,.3); --row-now:rgba(0,0,0,.28); --shadow:none; --tshadow:0 1px 3px rgba(0,0,0,.85),0 0 8px rgba(0,0,0,.5); }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
html{font-size:var(--fs)}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);text-shadow:var(--tshadow);padding:.6rem;-webkit-font-smoothing:antialiased}
.card{display:flex;flex-direction:column;max-height:100%;background:var(--card);border-radius:1.1rem;padding:1rem 1.15rem;box-shadow:var(--shadow)}
.card.hide{display:none}
html.timer body{padding:.4rem}
html.timer .card{background:var(--card);box-shadow:var(--shadow);height:auto;display:inline-flex;padding:.5em .9em}
html.timer[data-theme="clear"] .card{background:transparent;box-shadow:none;padding:0 .1em}
html.timer body{display:flex;align-items:flex-start;justify-content:flex-start}
html.timer[data-align="right"] body{justify-content:flex-end}
html.timer[data-align="right"] .tv{text-align:right}
html.timer[data-align="center"] body{justify-content:center}
html.timer[data-align="center"] .tv{text-align:center}
.tv{font-size:calc(var(--ts) * 6vw);line-height:1.05;color:var(--ink)}
html[data-theme="clear"] .tv{color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6),0 0 2px rgba(0,0,0,.8)}
.tv .lb{font-weight:800;font-size:1.25em}
.tv .lb .st{font-weight:700;opacity:.75;font-size:.8em}
.tv .cd{font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;font-size:4.3em;line-height:1;font-variant-numeric:tabular-nums}
.tv .cd.big{font-size:3.1em}
.tv .nx{font-weight:700;font-size:.8em;opacity:.8;margin-top:.15em}
.tv.flash .cd{animation:tflash 1.2s}
@keyframes tflash{0%,40%{color:var(--accent)}}
.tc{position:fixed;left:50%;bottom:.4rem;transform:translateX(-50%);display:flex;gap:.3rem;opacity:0;transition:opacity .2s}
html.mv .tc{opacity:1}
.tc{z-index:5}html.setopen .tc{opacity:1}
.tset{position:fixed;inset:.4rem;z-index:6;overflow:auto;background:rgba(20,24,36,.97);color:#fff;text-shadow:none;border-radius:.8rem;padding:.7rem .8rem;font:700 14px 'Nunito',sans-serif;display:flex;flex-direction:column;gap:.45rem}
.tset[hidden]{display:none}
.tset .g{display:grid;grid-template-columns:repeat(3,1fr);gap:.35rem .6rem}
.tset label{display:flex;flex-direction:column;gap:.15rem;font-size:12px;opacity:.95}
.tset input,.tset select{font:800 15px 'Nunito',sans-serif;padding:.3rem .4rem;border-radius:.4rem;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;width:100%}
.tset select option{color:#000}
.tset .r{display:flex;gap:.4rem;align-items:flex-end;flex-wrap:wrap}
.tset .r label{flex:1 1 8rem}
.tset button{font:800 14px 'Nunito',sans-serif;border:0;border-radius:.5rem;padding:.4rem .7rem;background:rgba(255,255,255,.15);color:#fff;cursor:pointer}
.tset button.pri{background:var(--accent)}
.tset button.on{background:#2e9e6b}
.tset .src{font-size:13px;opacity:.95}
.tset .ok{color:#7dffb0;margin-left:.4rem}
.tset small{opacity:.7;font-size:11px}
.tset input[type=range]{padding:0;accent-color:var(--accent)}
.tc button{font:800 15px 'Nunito',sans-serif;border:0;border-radius:.6rem;padding:.4rem .6rem;background:rgba(0,0,0,.65);color:#fff;cursor:pointer}
html.clock body{padding:.4rem;display:flex;align-items:flex-end;justify-content:flex-end}
html.clock .card{display:inline-flex;font-size:calc(var(--cs) * 3.4vw);padding:.5em .85em .55em;border-radius:.75em;text-align:right}
html.clock[data-align="left"] body{justify-content:flex-start}
html.clock[data-align="left"] .card{text-align:left}
html.clock[data-align="center"] body{justify-content:center}
html.clock[data-align="center"] .card{text-align:center}
html.clock[data-theme="clear"] .card{padding:0 .15em}
html.clock[data-theme="clear"] body{text-shadow:0 1px 2px rgba(0,0,0,.55),0 0 .9em rgba(0,0,0,.35)}
.ck .br{font-weight:800;font-size:.62em;letter-spacing:.16em;line-height:1.3;color:var(--accent)}
.ck .tm{font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;font-size:2.5em;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.ck .tm small{font-size:.36em;font-weight:700;color:var(--muted);margin-left:.1em}
.ck .sub{font-weight:700;font-size:.84em;color:var(--muted);line-height:1.3;margin-top:.12em;white-space:nowrap}
.ck .sub b{color:var(--ink);font-weight:800}
.ck .sub i{font-style:normal;color:var(--accent);margin:0 .3em}
html.clock[data-style="line"] .ck{display:flex;align-items:baseline;gap:.55em}
html.clock[data-style="line"] .ck .tm{font-size:1.7em}
html.clock[data-style="line"] .ck .sub{margin:0}
/* view=clock look=glass|pastel|app: 3 kiểu thẻ đồng hồ tự vẽ nền (không theo theme). Đơn vị em: 1em ≈ 16px ở khung 460px. */
html.clock[data-look] body{text-shadow:none}
html.clock[data-look] .card{background:none;box-shadow:none;padding:.9em;border-radius:0;font-size:calc(var(--cs) * 3.5vw)}
.kb{animation:kblink 1s step-end}
@keyframes kblink{50%{opacity:.35}}
.kg{font-family:'Outfit','Nunito',sans-serif;color:#fff;background:linear-gradient(160deg,rgba(28,22,40,.62),rgba(14,12,22,.72));border:1px solid rgba(255,255,255,.16);border-radius:1.25em;padding:.85em 1.4em .9em;box-shadow:0 .6em 1.9em rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.12);text-align:right}
.kg .t{font-weight:300;font-size:4em;line-height:.95;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.kg .t b{font-weight:300;color:#ff5fa8}
.kg .t small{font-size:.31em;font-weight:500;color:rgba(255,255,255,.55);margin-left:.2em;letter-spacing:.02em}
.kg .r{display:flex;justify-content:flex-end;align-items:center;gap:.75em;margin-top:.5em;padding-top:.5em;border-top:1px solid rgba(255,255,255,.14);font-size:.82em;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.7);white-space:nowrap}
.kg .r .cy{color:#fff;font-weight:700}
.kg .r i{width:.45em;height:.45em;border-radius:50%;background:#ff5fa8;box-shadow:0 0 .6em #ff5fa8}
.kp{text-align:left;font-family:'Fredoka','Nunito',sans-serif;background:#fff7f0;color:#3a1027;border-radius:1.6em;padding:.75em 1.4em .75em 1em;display:flex;align-items:center;gap:.9em;box-shadow:0 .5em 1.5em rgba(120,0,60,.22),0 0 0 .19em #ffd3e6;white-space:nowrap}
.kp .ic{width:3.4em;height:3.4em;border-radius:1.1em;background:linear-gradient(150deg,#ffd3e6,#ffe9b8);display:grid;place-items:center;flex:none}
.kp .ic svg{width:1.9em;height:1.9em}
.kp .t{font-weight:700;font-size:3.1em;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.kp .t small{font-size:.36em;font-weight:600;margin-left:.06em}
.kp .r{font-weight:700;font-size:.94em;margin-top:.12em}
.kp .r span{border-radius:99em;padding:.05em .6em;margin-left:.4em;font-size:.83em}
/* Màu chữ thẻ pastel khoá cứng (!important + text-fill): CSS tuỳ chỉnh của OBS hay theme=clear có ghi "chữ trắng" thì chữ vẫn tối, đọc được trên thẻ kem.
   Độ tương phản trên nền #fff7f0: giờ 15.4, dấu hai chấm 5.5, giây 4.8, dòng dưới 7.0, chip trắng trên #c2185b 5.9 (WCAG ≥ 4.5). */
html.clock .card .kp,html.clock .card .kp *{text-shadow:none !important}
html.clock .card .kp .t{color:#3a1027 !important;-webkit-text-fill-color:#3a1027 !important}
html.clock .card .kp .t b{color:#c2185b !important;-webkit-text-fill-color:#c2185b !important}
html.clock .card .kp .t small{color:#9a5a78 !important;-webkit-text-fill-color:#9a5a78 !important}
html.clock .card .kp .r{color:#8a3a5f !important;-webkit-text-fill-color:#8a3a5f !important}
html.clock .card .kp .r span{background:#c2185b !important;color:#fff !important;-webkit-text-fill-color:#fff !important}
.ka{font-family:'Outfit','Nunito',sans-serif;background:rgba(18,24,38,.9);border:1px solid #2b3550;border-radius:.9em;overflow:hidden;box-shadow:0 .75em 1.9em rgba(0,0,0,.35);color:#fff;white-space:nowrap}
.ka .bar{display:flex;align-items:center;gap:.4em;padding:.5em .75em;background:rgba(255,255,255,.04);border-bottom:1px solid #232c40;font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:500}
.ka .bar i{width:.8em;height:.8em;border-radius:50%}
.ka .bar em{margin-left:auto;font-style:normal;padding-left:2em}
.ka .bd{padding:.6em 1em .75em;display:flex;align-items:flex-end;justify-content:space-between;gap:1em}
.ka .t{font-family:'Space Mono',monospace;font-weight:700;font-size:2.9em;line-height:1;letter-spacing:-.05em}
.ka .t b{color:#ffc72c}
.ka .t small{font-size:.37em;color:rgba(255,255,255,.45);letter-spacing:0}
.ka .d{text-align:right;font-size:.82em;line-height:1.35;color:rgba(255,255,255,.65);font-weight:500}
.ka .d strong{display:block;color:#fff;font-weight:700;font-size:1.15em}
.ka .chip{display:inline-block;margin-top:.2em;font-size:.85em;font-weight:700;letter-spacing:.06em;color:#2ee6c8;border:1px solid rgba(46,230,200,.4);border-radius:99em;padding:0 .55em}
.top{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.range{font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;font-size:1.45rem;line-height:1.1;letter-spacing:.01em}
.pill{display:inline-flex;align-items:center;gap:.4rem;font-weight:800;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:.28rem .65rem;border-radius:99rem;background:var(--row-now);white-space:nowrap}
.pill.live{background:#ff2d55;color:#fff;text-shadow:none}
.pill.live i{width:.5rem;height:.5rem;border-radius:50%;background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.title{color:var(--muted);font-weight:700;font-size:.95rem;margin-top:.15rem}
.bar{display:flex;gap:2px;height:.5rem;border-radius:99rem;overflow:hidden;margin:.65rem 0 .5rem;position:relative}
.bar i{display:block;height:100%;min-width:3px}
.bar i.past{opacity:.35}
.bar b{position:absolute;top:0;bottom:0;width:3px;background:var(--ink);border-radius:2px;box-shadow:0 0 4px rgba(0,0,0,.4)}
.chip{color:var(--muted);font-weight:700;font-size:.78rem;line-height:1.35;padding-bottom:.55rem;border-bottom:1px dashed var(--line)}
.now{display:flex;align-items:center;justify-content:space-between;gap:.7rem;margin-top:.65rem;padding:.6rem .8rem;border-radius:.8rem;background:var(--row-now);border-left:.3rem solid var(--c,var(--accent))}
.now .lbl{font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.now .nm{font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;font-size:1.2rem;line-height:1.15}
.now .nx{font-size:.74rem;font-weight:700;color:var(--muted);margin-top:.1rem}
.now .cd{font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;font-size:1.75rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--c,var(--accent))}
.list{list-style:none;margin:.45rem 0 0;padding:0;overflow:hidden;flex:1 1 auto;min-height:0;position:relative}
.list.more{-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
.list li{display:grid;grid-template-columns:.62rem 3.3rem 1fr auto;align-items:center;gap:.6rem;padding:.3rem .45rem;border-radius:.55rem;font-weight:700;font-size:.9rem;position:relative;overflow:hidden}
.list li .d{width:.62rem;height:.62rem;border-radius:50%}
.list li .t{font-variant-numeric:tabular-nums}
.list li .m{color:var(--muted);font-variant-numeric:tabular-nums}
.list li.past{opacity:.35}
.list li.cur{background:var(--row-now);font-weight:800}
.list li .m.cd{color:var(--c);font-weight:800}
.list li.cur .p{position:absolute;left:0;bottom:0;height:.14rem;background:var(--c)}
.note{margin-top:.5rem;padding:.5rem .8rem;border-radius:.8rem;background:rgba(16,20,32,.92);border-left:.3rem solid var(--accent);color:#fff;text-shadow:none;font-weight:800;font-size:1.05rem;line-height:1.3;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:var(--shadow)}
.note[hidden]{display:none}
.note span{display:block}
.note.mq{white-space:nowrap}
.note.mq span{display:inline-block;animation:mq var(--d,14s) linear infinite}
.note.mq em{font-style:normal;padding-right:3rem}
@keyframes mq{to{transform:translateX(var(--dx,0))}}
.big{margin:0 0 .6rem;padding:.65rem .9rem .7rem;border-radius:.85rem;background:var(--row-now);border-left:.32rem solid var(--c);text-align:left}
.big .bl{display:flex;align-items:center;justify-content:space-between;gap:.5rem;white-space:nowrap;font:800 1.1rem/1.1 'Baloo 2','Nunito',sans-serif;letter-spacing:.02em;text-transform:uppercase;color:var(--c)}
.big .bl .pill{font-family:'Nunito',sans-serif;font-size:.62rem;padding:.22rem .55rem;letter-spacing:.08em}
.big .bc{font:800 3.6rem/1 'Baloo 2','Nunito',sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);margin:.15rem 0 .4rem;white-space:nowrap}
.big .bp{height:.3rem;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:.45rem}
.big .bp i{display:block;height:100%;background:var(--c)}
