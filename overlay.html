<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>EP Study Room · Lịch live (OBS)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<!-- =========================================================
   BẢNG LỊCH LIVE CHO OBS (Browser Source) — trang riêng, không cần đăng nhập, không có nút bấm.
   Chỉ đọc lịch live CÔNG KHAI (weekly_schedules trong Firestore, giống trang Lịch), tự cập nhật theo giờ thực:
   tô sáng đoạn đang chạy + đếm ngược, làm mờ các đoạn đã qua, tự cuộn để đoạn hiện tại luôn trong khung.
   Lấy lịch lại 3 phút một lần (1 lượt đọc Firebase mỗi lần); lỗi / hết hạn mức thì dùng site-fallback.json.
   Tuỳ chọn trên địa chỉ (ghép bằng & sau dấu ?), ví dụ overlay.html?size=1.3&theme=light&total=0
     size=1.3        cỡ chữ (1 = mặc định, 0.6 – 3)
     (mặc định chữ tự thu nhỏ cho vừa khung OBS để thấy hết lịch; fit=0 để tắt, khi đó danh sách tự cuộn)
     rows=8          chỉ hiện 8 dòng, tự cuộn theo đoạn hiện tại
     theme=dark      dark | light | pink | clear (clear = nền trong suốt, chữ trắng có bóng)
     opacity=0.85    độ đậm của nền thẻ (0 – 1)
     accent=ff3d9a   màu chính (mã màu, không có #)
     total=0 / bar=0 / chip=0 / title=0 / status=0 / now=0   ẩn: tổng phút / thanh màu / dòng tóm tắt / tên buổi / nhãn trạng thái / ô "đang"
     list=0          ẩn danh sách các mốc (chỉ còn phần đầu + ô đang chạy)
     empty=hide      ngày không có live thì ẩn hẳn (mặc định hiện một dòng nhỏ)
     after=60        sau khi buổi kết thúc, còn hiện thêm bao nhiêu phút
     lang=vi         tiếng Việt (mặc định tiếng Anh, cho khán giả YouTube quốc tế)
     tz=Asia/Tokyo   hiện giờ theo múi giờ khác (mặc định giờ Việt Nam)
     view=clock      khối đồng hồ giờ địa phương "EP STUDY ROOM · Local time in Ho Chi Minh · ngày · giờ"
                     (thêm: align=left|center, name=…/name=0, city=…, sec=0 ẩn giây, date=0 ẩn ngày)
     demo=1          xem thử bằng một buổi mẫu đang chạy (để căn chỉnh khi chưa tới giờ live)
   ========================================================= -->
<style>
:root{
  --fs:20px; --accent:#ff3d9a; --short:#2ee6c8; --long:#ffc72c; --prep:#8e9bb0;
  --card:rgba(16,20,32,var(--op,.82)); --ink:#fff; --muted:rgba(255,255,255,.66); --line:rgba(255,255,255,.14); --row-now:rgba(255,255,255,.1);
  --shadow:0 .4rem 1.6rem rgba(0,0,0,.28); --tshadow:none;
}
html[data-theme="light"]{ --card:rgba(255,255,255,var(--op,.92)); --ink:#1d2333; --muted:rgba(29,35,51,.6); --line:rgba(29,35,51,.14); --row-now:rgba(29,35,51,.06); --shadow:0 .3rem 1.2rem rgba(0,0,0,.14); }
html[data-theme="pink"]{ --card:rgba(255,240,247,var(--op,.93)); --ink:#3a1027; --muted:rgba(58,16,39,.6); --line:rgba(58,16,39,.14); --row-now:rgba(255,61,154,.1); --shadow:0 .3rem 1.2rem rgba(120,0,60,.18); }
html[data-theme="clear"]{ --card:transparent; --ink:#fff; --muted:rgba(255,255,255,.82); --line:rgba(255,255,255,.3); --row-now:rgba(0,0,0,.28); --shadow:none; --tshadow:0 1px 3px rgba(0,0,0,.85),0 0 8px rgba(0,0,0,.5); }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
html{font-size:var(--fs)}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);text-shadow:var(--tshadow);padding:.6rem;-webkit-font-smoothing:antialiased}
.card{display:flex;flex-direction:column;max-height:100%;background:var(--card);border-radius:1.1rem;padding:1rem 1.15rem;box-shadow:var(--shadow)}
.card.hide{display:none}
html.clock body{padding:.3rem;display:flex;align-items:flex-end;justify-content:flex-end}
html.clock .card{padding:.45em .9em .5em;font-size:calc(var(--cs) * 5vw);text-align:right}
html.clock[data-align="left"] body{justify-content:flex-start}
html.clock[data-align="left"] .card{text-align:left}
html.clock[data-align="center"] body{justify-content:center}
html.clock[data-align="center"] .card{text-align:center}
html.clock[data-theme="clear"] .card{padding:0 .1em}
.ck .br{font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;font-size:1.15em;letter-spacing:.05em;line-height:1.1}
.ck .sub{font-weight:700;font-size:.62em;color:var(--muted);line-height:1.35}
.ck .tm{font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;font-size:2.7em;line-height:1;margin-top:.08em;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.ck .tm small{font-size:.5em;color:var(--accent);margin-left:.06em}
.top{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
.range{font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;font-size:1.45rem;line-height:1.1;letter-spacing:.01em}
.pill{display:inline-flex;align-items:center;gap:.4rem;font-weight:800;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:.28rem .65rem;border-radius:99rem;background:var(--row-now);white-space:nowrap}
.pill.live{background:#ff2d55;color:#fff;text-shadow:none}
.pill.live i{width:.5rem;height:.5rem;border-radius:50%;background:#fff;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.title{color:var(--muted);font-weight:700;font-size:.95rem;margin-top:.15rem}
.bar{display:flex;gap:2px;height:.5rem;border-radius:99rem;overflow:hidden;margin:.65rem 0 .5rem;position:relative}
.bar i{display:block;height:100%;min-width:3px}
.bar i.past{opacity:.35}
.bar b{position:absolute;top:0;bottom:0;width:3px;background:var(--ink);border-radius:2px;box-shadow:0 0 4px rgba(0,0,0,.4)}
.chip{color:var(--muted);font-weight:700;font-size:.78rem;line-height:1.35;padding-bottom:.55rem;border-bottom:1px dashed var(--line)}
.now{display:flex;align-items:center;justify-content:space-between;gap:.7rem;margin-top:.65rem;padding:.6rem .8rem;border-radius:.8rem;background:var(--row-now);border-left:.3rem solid var(--c,var(--accent))}
.now .lbl{font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.now .nm{font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;font-size:1.2rem;line-height:1.15}
.now .nx{font-size:.74rem;font-weight:700;color:var(--muted);margin-top:.1rem}
.now .cd{font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;font-size:1.75rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--c,var(--accent))}
.list{list-style:none;margin:.45rem 0 0;padding:0;overflow:hidden;flex:1 1 auto;min-height:0;position:relative}
.list.more{-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
.list li{display:grid;grid-template-columns:.62rem 3.3rem 1fr auto;align-items:center;gap:.6rem;padding:.3rem .45rem;border-radius:.55rem;font-weight:700;font-size:.9rem;position:relative;overflow:hidden}
.list li .d{width:.62rem;height:.62rem;border-radius:50%}
.list li .t{font-variant-numeric:tabular-nums}
.list li .m{color:var(--muted);font-variant-numeric:tabular-nums}
.list li.past{opacity:.35}
.list li.cur{background:var(--row-now);font-weight:800}
.list li.cur .p{position:absolute;left:0;bottom:0;height:.14rem;background:var(--c)}
.total{text-align:center;color:var(--muted);font-weight:700;font-size:.8rem;padding-top:.45rem}
.empty{color:var(--muted);font-weight:700;font-size:.95rem}
</style>
</head>
<body>
<div class="card" id="card"><div class="empty" id="msg"></div></div>
<script>
(function(){
'use strict';
/* ---------- tuỳ chọn trên địa chỉ ---------- */
const Q = new URLSearchParams(location.search);
const num = (k, d, lo, hi) => { const v = parseFloat(Q.get(k)); return isNaN(v) ? d : Math.min(hi, Math.max(lo, v)); };
const off = k => Q.get(k) === '0' || Q.get(k) === 'false';
const OPT = {
  size: num('size', 1, .6, 3), rows: Math.round(num('rows', 0, 0, 60)), after: num('after', 60, 0, 720),
  theme: ['dark', 'light', 'pink', 'clear'].includes(Q.get('theme')) ? Q.get('theme') : 'dark',
  lang: Q.get('lang') === 'vi' ? 'vi' : 'en', tz: Q.get('tz') || 'Asia/Ho_Chi_Minh', demo: Q.get('demo') === '1',
  emptyHide: Q.get('empty') === 'hide', fit: !off('fit') && !Q.get('rows')
};
const root = document.documentElement;
root.dataset.theme = OPT.theme; root.lang = OPT.lang;
root.style.setProperty('--fs', (20 * OPT.size).toFixed(1) + 'px');
if (Q.has('opacity')) root.style.setProperty('--op', num('opacity', .85, 0, 1));
if (/^[0-9a-f]{3}([0-9a-f]{3})?$/i.test(Q.get('accent') || '')) root.style.setProperty('--accent', '#' + Q.get('accent'));
let fmtHM;
try { fmtHM = new Intl.DateTimeFormat('en-GB', { timeZone: OPT.tz, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }); }
catch (e) { fmtHM = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Ho_Chi_Minh', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }); }
const hm = ms => fmtHM.format(new Date(ms));

const TXT = {
  vi: { focus:'Tập trung', short:'Nghỉ ngắn', long:'Nghỉ dài', prep:'Chuẩn bị & chào', live:'Đang live', soon:'Bắt đầu sau {t}', done:'Đã xong', now:'Đang', next:'Tiếp theo', end:'Kết thúc lúc {t}', at:'lúc', total:'Tổng {m} phút', empty:'Hôm nay không có buổi live', loading:'Đang tải lịch…', notyet:'Chưa bắt đầu', first:'Mở đầu',
        pomo:'{n} × {f}′ tập trung · {s}′ nghỉ · {l}′ nghỉ dài', plan:'{n} khối tập trung · {f} phút tập trung · {b} phút nghỉ' },
  en: { focus:'Focus', short:'Short break', long:'Long break', prep:'Warm-up & hello', live:'Live now', soon:'Starts in {t}', done:'Finished', now:'Now', next:'Next', end:'Ends at {t}', at:'at', total:'Total {m} min', empty:'No live session today', loading:'Loading schedule…', notyet:'Not started', first:'First up',
        pomo:'{n} × {f}′ focus · {s}′ break · {l}′ long break', plan:'{n} focus blocks · {f} min focus · {b} min break' }
}[OPT.lang];
const tr = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const COLOR = { focus:'var(--accent)', short:'var(--short)', long:'var(--long)', prep:'var(--prep)' };

/* ---------- lịch live: cùng cách tính với core.js (normSlot, slotSegs, buildPlan, weekKeyFor) ---------- */
const VN_OFF = 7 * 3600e3, DAY = 864e5;                 // Việt Nam luôn UTC+7
function isoWeek(y, m, d){
  const t = new Date(Date.UTC(y, m - 1, d)), wd = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - wd);
  return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / DAY + 1) / 7);
}
function mondayVN(ms){                                  // thứ Hai 00:00 giờ VN (tính như một mốc UTC) của tuần chứa ms
  const v = new Date(ms + VN_OFF), wd = v.getUTCDay() || 7;
  return Date.UTC(v.getUTCFullYear(), v.getUTCMonth(), v.getUTCDate() - (wd - 1));
}
const weekKey = mon => { const d = new Date(mon); return `${d.getUTCFullYear()}-W${isoWeek(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate())}`; };
const n0 = (v, d, min = 1) => Math.max(min, Math.round(+v || d));
function cleanPomo(p){ p = p || {}; return { focus:n0(p.focus, 25), short:n0(p.short, 5, 0), long:n0(p.long, 15, 0), rounds:n0(p.rounds, 4), longEvery:n0(p.longEvery, 4), prep:n0(p.prep, 0, 0) }; }
function buildPlan(p){
  const segs = []; if (p.prep > 0) segs.push({ type:'prep', min:p.prep });
  for (let i = 1; i <= p.rounds; i++) {
    segs.push({ type:'focus', min:p.focus, n:i });
    if (i % p.longEvery === 0) { if (p.long) segs.push({ type:'long', min:p.long }); }
    else if (i < p.rounds && p.short) segs.push({ type:'short', min:p.short });
  }
  return segs;
}
const SEG_TYPE = { f:'focus', s:'short', l:'long', p:'prep' };
function slotSegs(s){
  if (Array.isArray(s.plan) && s.plan.length) { let n = 0; return s.plan.map(x => { const type = SEG_TYPE[x.t] || 'focus', seg = { type, min:n0(x.m, 1) }; if (type === 'focus') seg.n = ++n; const nm = String(x.nm || '').trim().slice(0, 40); if (nm) seg.name = nm; return seg; }); }
  return s.pomo ? buildPlan(cleanPomo(s.pomo)) : null;
}
function chipOf(s, segs){
  if (Array.isArray(s.plan) && s.plan.length) { const f = segs.filter(g => g.type === 'focus'); return tr(TXT.plan, { n:f.length, f:f.reduce((a, g) => a + g.min, 0), b:segs.filter(g => g.type === 'short' || g.type === 'long').reduce((a, g) => a + g.min, 0) }); }
  const p = cleanPomo(s.pomo); return tr(TXT.pomo, { n:p.rounds, f:p.focus, s:p.short, l:p.long });
}
const labelOf = g => g.name || (g.type === 'focus' ? `${TXT.focus} ${g.n}` : TXT[g.type]);
function daySlots(d){                                   // hỗ trợ cả định dạng cũ {m,a,e,m_h,…}
  d = d || {};
  if (Array.isArray(d.slots)) return { cancelled:!!d.cancelled, slots:d.slots.filter(Boolean) };
  return { cancelled:false, slots:['m', 'a', 'e'].filter(k => d[k]).map(k => ({ time:d[k], manualH:d[k + '_h'] })) };
}
function sessionsOf(mon, days){
  const out = [];
  (days || []).forEach((raw, i) => {
    const day = daySlots(raw); if (day.cancelled) return;
    day.slots.forEach(s => {
      if (s.cancelled) return;
      const p = String(s.time || '').trim().split(':'), h = parseInt(p[0], 10), mi = parseInt(p[1], 10);
      if (p.length < 2 || isNaN(h) || isNaN(mi)) return;
      const segs = slotSegs(s), mins = segs ? segs.reduce((a, g) => a + g.min, 0) : Math.round((parseFloat(s.manualH) || 2) * 60);
      const start = mon + i * DAY + (h * 60 + mi) * 60e3 - VN_OFF;
      out.push({ start, end:start + mins * 60e3, mins, title:String(s.title || ''), segs, chip:segs ? chipOf(s, segs) : '' });
    });
  });
  return out;
}

/* ---------- đọc dữ liệu công khai (Firestore REST, không cần đăng nhập) ---------- */
const PROJECT = 'epstudyroom-web', API_KEY = 'AIzaSyD4K9ugw33zVJnpRAHKzY6Bq8i8IOXLjmo';   // giống js/firebase-config.js, khoá công khai
const BASE = `https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/weekly_schedules/`;
function dec(v){
  if (!v || typeof v !== 'object') return null;
  if ('mapValue' in v) { const o = {}, f = v.mapValue.fields || {}; for (const k in f) o[k] = dec(f[k]); return o; }
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(dec);
  if ('integerValue' in v) return +v.integerValue;
  if ('doubleValue' in v) return +v.doubleValue;
  if ('booleanValue' in v) return !!v.booleanValue;
  if ('stringValue' in v) return v.stringValue;
  if ('timestampValue' in v) return v.timestampValue;
  return null;
}
async function fetchWeek(key){
  const r = await fetch(BASE + encodeURIComponent(key) + '?mask.fieldPaths=days&key=' + API_KEY, { cache:'no-store' });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('firestore ' + r.status);
  const j = await r.json(); return j.fields && j.fields.days ? dec(j.fields.days) : null;
}
let fallback = null;
async function fallbackWeek(key){
  if (!fallback) { const r = await fetch('site-fallback.json?d=' + new Date().toISOString().slice(0, 10), { cache:'no-cache' }); fallback = r.ok ? await r.json() : {}; }
  const w = fallback.site && fallback.site.weeks; return w && key in w ? w[key] : null;
}
const store = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let sessions = null, loadT = 0;
async function load(){
  const now = Date.now(), mons = [...new Set([mondayVN(now - DAY), mondayVN(now), mondayVN(now + DAY)])];
  const cache = store.get('ep-overlay-weeks') || {};
  let all = [], failed = false;
  for (const mon of mons) {
    const key = weekKey(mon); let days;
    try { days = await fetchWeek(key); cache[key] = days; }
    catch (e) { failed = true; days = key in cache ? cache[key] : await fallbackWeek(key).catch(() => null); }
    all = all.concat(sessionsOf(mon, days));
  }
  store.set('ep-overlay-weeks', cache);
  sessions = all.sort((a, b) => a.start - b.start); loadT = now;
  return !failed;
}
function demo(){                                        // buổi mẫu giống ảnh: bắt đầu 95 phút trước
  const st = Date.now() - 95 * 60e3, segs = buildPlan(cleanPomo({ prep:20, focus:50, short:10, long:120, rounds:10, longEvery:4 }));
  const mins = segs.reduce((a, g) => a + g.min, 0);
  sessions = [{ start:st, end:st + mins * 60e3, mins, title:'All day', segs, chip:chipOf({ pomo:{ prep:20, focus:50, short:10, long:120, rounds:10, longEvery:4 } }, segs) }];
}

/* ---------- chọn buổi để hiện: đang live → sắp tới trong hôm nay/24 giờ → vừa xong ---------- */
function pick(now){
  if (!sessions) return null;
  const live = sessions.find(s => now >= s.start && now < s.end); if (live) return { s:live, mode:'live' };
  const next = sessions.find(s => s.start > now && s.start - now < DAY);
  const prev = sessions.filter(s => s.end <= now && now - s.end < OPT.after * 60e3).pop();
  if (prev && (!next || next.start - now > 30 * 60e3)) return { s:prev, mode:'done' };
  return next ? { s:next, mode:'soon' } : null;
}
const pad = n => String(n).padStart(2, '0');
function clock(ms){ const t = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`; }

/* ---------- vẽ ---------- */
const card = document.getElementById('card');
let lastKey = '', fitScale = 1;
// Tự thu nhỏ chữ cho vừa khung OBS để thấy hết lịch (tắt bằng fit=0, hoặc khi đặt rows=…).
// Chỉ tính lại khi đổi buổi / trạng thái / kích thước khung, nên chữ không nhảy mỗi giây.
function fit(list, key){
  if (!OPT.fit) return;
  const setFs = k => root.style.setProperty('--fs', (20 * OPT.size * k).toFixed(2) + 'px');
  if (key === lastKey) { setFs(fitScale); return; }
  lastKey = key; fitScale = 1; setFs(1);
  const over = () => (list && list.scrollHeight > list.clientHeight + 1) || card.scrollHeight > card.clientHeight + 1;
  while (over() && fitScale > .45) { fitScale *= .96; setFs(fitScale); }
}
function render(){
  const now = Date.now(), p = pick(now);
  if (!p) {
    card.classList.toggle('hide', OPT.emptyHide && sessions !== null);
    card.innerHTML = `<div class="empty">${esc(sessions === null ? TXT.loading : TXT.empty)}</div>`; lastKey = ''; return;
  }
  card.classList.remove('hide');
  const s = p.s, segs = s.segs || [];
  let t = s.start, cur = -1;
  const rows = segs.map((g, i) => { const a = t; t += g.min * 60e3; if (p.mode === 'live' && now >= a && now < t) cur = i; return { g, a, b:t }; });
  const state = i => p.mode === 'done' ? 'past' : p.mode === 'soon' ? '' : i < cur ? 'past' : i === cur ? 'cur' : '';
  const pill = p.mode === 'live' ? `<span class="pill live"><i></i>${esc(TXT.live)}</span>` : p.mode === 'soon' ? `<span class="pill">${esc(tr(TXT.soon, { t:clock(s.start - now) }))}</span>` : `<span class="pill">${esc(TXT.done)}</span>`;
  let h = `<div class="top"><div class="range">${hm(s.start)} – ${hm(s.end)}</div>${off('status') ? '' : pill}</div>`;
  if (s.title && !off('title')) h += `<div class="title">${esc(s.title)}</div>`;
  if (segs.length && !off('bar')) {
    const pos = p.mode === 'live' ? ((now - s.start) / (s.end - s.start) * 100).toFixed(2) : null;
    h += `<div class="bar">${rows.map((r, i) => `<i class="${state(i) === 'past' ? 'past' : ''}" style="flex:${r.g.min};background:${COLOR[r.g.type]}"></i>`).join('')}${pos !== null ? `<b style="left:calc(${pos}% - 1px)"></b>` : ''}</div>`;
  }
  if (s.chip && !off('chip')) h += `<div class="chip">${esc(s.chip)}</div>`;
  if (!off('now') && segs.length) {
    if (p.mode === 'live' && cur >= 0) {
      const r = rows[cur], nx = rows[cur + 1];
      h += `<div class="now" style="--c:${COLOR[r.g.type]}"><div><div class="lbl">${esc(TXT.now)}</div><div class="nm">${esc(labelOf(r.g))}</div><div class="nx">${nx ? `${esc(TXT.next)}: ${esc(labelOf(nx.g))} ${esc(TXT.at)} ${hm(nx.a)}` : esc(tr(TXT.end, { t:hm(s.end) }))}</div></div><div class="cd">${clock(r.b - now)}</div></div>`;
    } else if (p.mode === 'soon') {
      h += `<div class="now" style="--c:${COLOR[segs[0].type]}"><div><div class="lbl">${esc(TXT.first)}</div><div class="nm">${esc(labelOf(segs[0]))}</div><div class="nx">${esc(TXT.at)} ${hm(s.start)}</div></div><div class="cd">${clock(s.start - now)}</div></div>`;
    }
  }
  if (segs.length && !off('list')) {
    h += `<ol class="list" id="list">${rows.map((r, i) => { const st = state(i), c = COLOR[r.g.type];
      return `<li class="${st}" style="--c:${c}"><span class="d" style="background:${c}"></span><span class="t">${hm(r.a)}</span><span>${esc(labelOf(r.g))}</span><span class="m">${r.g.min}′</span>${st === 'cur' ? `<span class="p" style="width:${((now - r.a) / (r.b - r.a) * 100).toFixed(1)}%"></span>` : ''}</li>`; }).join('')}</ol>`;
  }
  if (!off('total')) h += `<div class="total">${esc(tr(TXT.total, { m:s.mins }))}</div>`;
  card.innerHTML = h;
  const list = document.getElementById('list');
  fit(list, `${s.start}|${p.mode}|${segs.length}|${innerWidth}x${innerHeight}`);
  if (list) {                                           // giữ đoạn đang chạy trong khung: chừa 1 dòng đã qua phía trên
    const li = list.children;
    if (OPT.rows && li.length > OPT.rows) list.style.maxHeight = (li[0].offsetHeight * OPT.rows) + 'px';
    const focus = p.mode === 'live' ? Math.max(0, cur - 1) : 0;
    list.scrollTop = li[focus] ? li[focus].offsetTop : 0;
    list.classList.toggle('more', list.scrollTop + list.clientHeight < list.scrollHeight - 2);   // còn dòng bên dưới: làm mờ dần mép dưới
  }
}

/* ---------- chạy: vẽ lại mỗi giây, lấy lịch mới 3 phút một lần (lỗi thì thử lại sau 1 phút) ---------- */
async function refresh(){
  let ok = true;
  if (OPT.demo) demo(); else ok = await load().catch(() => false);
  render();
  setTimeout(refresh, ok ? 180e3 : 60e3);
}
/* view=clock: khối "EP STUDY ROOM · Local time in … · ngày · giờ" cho góc màn hình stream (không đọc lịch, không tốn lượt đọc Firebase) */
if (Q.get('view') === 'clock') {
  root.classList.add('clock'); root.dataset.align = ['left', 'center'].includes(Q.get('align')) ? Q.get('align') : 'right';
  root.style.setProperty('--cs', OPT.size);
  const tz = fmtHM.resolvedOptions().timeZone, loc = OPT.lang === 'vi' ? 'vi-VN' : 'en-GB';
  const city = Q.get('city') || (tz === 'Asia/Ho_Chi_Minh' || tz === 'Asia/Saigon' ? 'Ho Chi Minh' : tz.split('/').pop().replace(/_/g, ' '));
  const brand = Q.get('name') === '0' ? '' : (Q.get('name') || 'EP STUDY ROOM'), showSec = !off('sec'), showDate = !off('date');
  const fDate = new Intl.DateTimeFormat(loc, { timeZone:tz, weekday:'long', day:'numeric', month:'long', year:'numeric' });
  const fHMS = new Intl.DateTimeFormat('en-GB', { timeZone:tz, hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23' });
  const tick = () => {
    const d = new Date(), [h, m, sec] = fHMS.format(d).split(':');
    card.innerHTML = `<div class="ck">${brand ? `<div class="br">${esc(brand)}</div>` : ''}<div class="sub">${esc(OPT.lang === 'vi' ? 'Giờ hiện tại ở ' + city : 'Local time in ' + city)}</div>${showDate ? `<div class="sub">${esc(fDate.format(d))}</div>` : ''}<div class="tm">${h}:${m}${showSec ? `<small>:${sec}</small>` : ''}</div></div>`;
  };
  tick(); setTimeout(() => { tick(); setInterval(tick, 1000); }, 1000 - Date.now() % 1000);   // đổi giây đúng lúc đồng hồ máy đổi
  return;
}
render(); refresh(); setInterval(render, 1000);
if (document.fonts) document.fonts.ready.then(() => { lastKey = ''; render(); });   // phông chữ tải xong thì đo lại cho vừa khung
})();
</script>
