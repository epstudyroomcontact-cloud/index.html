<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="scrim" id="scrim" data-act="closeNav"></div>

  <div class="main">
    <div class="announce hidden" id="ann-bar"><span id="ann-text"></span></div>
    <header class="topbar">
      <button class="icon-btn menu-btn" data-act="openNav" aria-label="Menu"><svg class="ic"><use href="#i-menu"/></svg></button>
      <div class="tb-title" id="tb-title"></div>
      <span class="live-pill hidden" id="live-pill"><i></i><span id="live-pill-t"></span></span>
      <div class="tb-actions">
        <button class="icon-btn hidden" id="btn-edit" data-act="editMode" title="Edit page" aria-label="Edit page"><svg class="ic"><use href="#i-pen"/></svg></button>
        <button class="icon-btn" id="btn-notif" data-act="notif" aria-label="Notifications"><svg class="ic"><use href="#i-bell"/></svg></button>
        <button class="icon-btn" id="btn-prefs" data-act="prefs" aria-label="Preferences"><svg class="ic"><use href="#i-sliders"/></svg></button>
        <button class="icon-btn" id="btn-cart" data-act="openCart" aria-label="Cart"><svg class="ic"><use href="#i-cart"/></svg><span class="dot hidden" id="cart-dot">0</span></button>
        <div class="pop" id="prefs">
          <label class="label" data-i18n="language">Language</label>
          <select class="select" id="sel-lang"></select>
          <label class="label" data-i18n="timezone">Timezone</label>
          <select class="select" id="sel-tz"></select>
          <label class="label" data-i18n="theme">Theme</label>
          <div class="theme-grid" id="theme-grid"></div>
          <div class="switch"><span data-i18n="calm">Reduce motion</span><input type="checkbox" id="chk-calm"></div>
        </div>
      </div>
    </header>
    <main class="page" id="page"></main>
  </div>
</div>

<div class="drawer" id="cart-drawer"></div>
<div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<div class="live-toast" id="live-toast">
  <span class="live-pill"><i></i><span data-i18n="signal">We're live</span></span>
  <div id="live-toast-text" style="font-weight:700;font-size:.9rem"></div>
  <a id="live-toast-link" class="btn primary sm" href="#/watch" data-i18n="connect">Watch</a>
  <button class="btn ghost icon sm" data-act="dismissLive" aria-label="Dismiss"><svg class="ic sm"><use href="#i-x"/></svg></button>
</div>
<div class="edit-bar" id="edit-bar">
  <span id="edit-bar-t"></span>
  <button class="btn primary sm" data-act="editMode"><span data-i18n="done_editing">Done</span></button>
</div>
<div id="toast"></div>
