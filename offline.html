<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b13">
<title>Ép Study Room</title>
<style>
  html,body{margin:0;height:100%;background:#080b13;color:#f7f3ff;font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif}
  main{min-height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}
  .box{max-width:360px}
  .logo{width:88px;height:88px;margin:0 auto}
  h1{font-size:1.3rem;margin:18px 0 8px}
  p{color:#c0c8de;line-height:1.5;margin:0 0 20px}
  button{font:inherit;font-weight:800;border:0;border-radius:99px;padding:11px 22px;color:#fff;cursor:pointer;background:linear-gradient(180deg,#ff8fb1,#ff3d9a 55%,#e0247f);box-shadow:0 6px 20px rgba(255,61,154,.45)}
</style>
</head>
<body>
<main><div class="box">
  <div class="logo" aria-hidden="true"><svg width="88" height="88" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><defs><linearGradient id="ga" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF7AB8"/><stop offset="1" stop-color="#E8368F"/></linearGradient></defs><path d="M60.51 20.22 A46 46 0 1 0 95.33 89.86 A39 39 0 0 1 60.51 20.22Z" fill="url(#ga)"/><path d="M22 70 Q27 75 32 70" stroke="#5A1F48" stroke-width="3.2" fill="none" stroke-linecap="round"/><ellipse cx="25" cy="80" rx="4.5" ry="3" fill="#FFB3D6"/><g stroke="#5A1F48" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
<path d="M82 58 Q72 51 60 54 L60 82 Q72 79 82 86 Z" fill="#FFF4F8"/>
<path d="M82 58 Q92 51 104 54 L104 82 Q92 79 82 86 Z" fill="#FFF4F8"/>
<path d="M66 63 Q71 62 76 64.5 M66 70 Q71 69 76 71.5 M88 64.5 Q93 62 98 63 M88 71.5 Q93 69 98 70" stroke="#FF8CC2" stroke-width="2.4" fill="none"/></g><path d="M104 17 Q105.62 24.38 113 26 Q105.62 27.62 104 35 Q102.38 27.62 95 26 Q102.38 24.38 104 17Z" fill="#FFC94D"/><path d="M116 39.5 Q116.81 43.19 120.5 44 Q116.81 44.81 116 48.5 Q115.19 44.81 111.5 44 Q115.19 43.19 116 39.5Z" fill="#FFC94D"/></svg></div>
  <h1 id="h">You're offline</h1>
  <p id="p">Ép Study Room needs an internet connection to load the schedule, your account and your planner. Check your connection and try again.</p>
  <button id="b" type="button">Try again</button>
</div></main>
<script>
  // Trang này chỉ hiện khi mất mạng (service worker trả về). Có mạng lại thì tự mở lại web.
  var T = {
    vi:['Bạn đang offline','Ép Study Room cần kết nối mạng để tải lịch live, tài khoản và planner của bạn. Kiểm tra mạng rồi thử lại nhé.','Thử lại'],
    hi:['आप ऑफ़लाइन हैं','शेड्यूल, आपका खाता और प्लानर लोड करने के लिए Ép Study Room को इंटरनेट चाहिए। कनेक्शन जाँचें और फिर कोशिश करें।','फिर कोशिश करें'],
    ja:['オフラインです','スケジュールやアカウント、プランナーを読み込むにはインターネット接続が必要です。接続を確認してもう一度お試しください。','再試行'],
    ko:['오프라인 상태예요','일정, 계정, 플래너를 불러오려면 인터넷 연결이 필요해요. 연결을 확인한 뒤 다시 시도해 주세요.','다시 시도'],
    zh:['你已离线','Ép Study Room 需要联网才能加载直播时间表、账号和计划。请检查网络后重试。','重试'],
    fr:['Vous êtes hors ligne',"Ép Study Room a besoin d'une connexion Internet pour charger le planning, votre compte et votre planner. Vérifiez la connexion puis réessayez.",'Réessayer'],
    es:['Estás sin conexión','Ép Study Room necesita conexión a Internet para cargar el horario, tu cuenta y tu planner. Revisa la conexión e inténtalo de nuevo.','Reintentar']
  };
  var lang = 'en'; try { lang = JSON.parse(localStorage.getItem('ep_lang')) || 'en'; } catch (e) {}
  if (T[lang]) { document.documentElement.lang = lang; document.getElementById('h').textContent = T[lang][0]; document.getElementById('p').textContent = T[lang][1]; document.getElementById('b').textContent = T[lang][2]; }
  document.getElementById('b').onclick = function () { location.reload(); };
  window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
